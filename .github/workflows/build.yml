name: build

# Runs on every push. Produces the injection payload (liboxhk.so + oxhk.dex) always, and the
# repacked game APK when the game's apks are reachable (repo secret GAME_APKS_URL, or the
# base_apk_url / split_apk_url inputs on a manual run).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      base_apk_url:
        description: "direct URL to base.apk (leave empty to only build the payload)"
        required: false
      split_apk_url:
        description: "direct URL to split_config.arm64_v8a.apk"
        required: false
      probe:
        description: "probe build (repack + resign, nothing injected)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payload:
    name: payload (liboxhk.so + dex)
    runs-on: ubuntu-latest
    outputs:
      apk_ready: ${{ steps.src.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: toolchain
        id: src
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK="$(ls -d "$SDK"/ndk/* | sort -V | tail -1)"
          echo "SDK=$SDK"                 >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK"    >> "$GITHUB_ENV"
          echo "ndk: $NDK"
          echo "build-tools: $(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          if [ -n "${{ inputs.base_apk_url }}" ] || [ -n "${{ secrets.GAME_APKS_URL }}" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no"  >> "$GITHUB_OUTPUT"
          fi

      - name: build
        run: ./oxide_int/tools/build.sh --no-apk

      - uses: actions/upload-artifact@v4
        with:
          name: oxhk-payload
          path: |
            oxide_int/build/liboxhk.so
            oxide_int/build/dex/classes.dex
          if-no-files-found: error

  repack:
    name: repack game apk
    needs: payload
    if: needs.payload.outputs.apk_ready == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@v4
        with:
          name: oxhk-payload
          path: oxide_int/build

      - name: artifact layout
        run: |
          set -e
          mkdir -p oxide_int/build/dex
          [ -f oxide_int/build/liboxhk.so ] || { echo "no liboxhk.so"; exit 1; }
          [ -f oxide_int/build/classes.dex ] && mv oxide_int/build/classes.dex oxide_int/build/dex/classes.dex
          ls -la oxide_int/build oxide_int/build/dex

      - name: apktool
        run: |
          set -e
          url=$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest \
                | grep -o 'https://github.com/iBotPeaches/Apktool/releases/download/[^"]*apktool_[0-9.]*\.jar' \
                | head -1)
          echo "apktool: $url"
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/apktool.jar" "$url"
          printf '#!/bin/sh\nexec java -jar %s/bin/apktool.jar "$@"\n' "$HOME" > "$HOME/bin/apktool"
          chmod +x "$HOME/bin/apktool"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: fetch game apks
        run: |
          set -e
          mkdir -p game
          BASE="${{ inputs.base_apk_url }}"
          SPLIT="${{ inputs.split_apk_url }}"
          if [ -z "$BASE" ]; then
            # manifest format: first line base url, second line split url
            BASE=$(curl -fsSL "${{ secrets.GAME_APKS_URL }}" | sed -n 1p)
            SPLIT=$(curl -fsSL "${{ secrets.GAME_APKS_URL }}" | sed -n 2p)
          fi
          curl -fL --retry 3 -o game/base.apk "$BASE"
          curl -fL --retry 3 -o game/split_config.arm64_v8a.apk "$SPLIT"
          ls -l game
          # sanity: it must really be the target build
          python3 - <<'PY'
          import zipfile, sys
          z = zipfile.ZipFile('game/split_config.arm64_v8a.apk')
          names = z.namelist()
          assert 'lib/arm64-v8a/libil2cpp.so' in names, 'split has no libil2cpp.so — wrong file'
          print('libs in split:', len([n for n in names if n.startswith('lib/arm64-v8a/')]))
          PY

      - name: repack + sign
        run: |
          set -e
          FLAG=""
          [ "${{ inputs.probe }}" = "true" ] && FLAG="--probe"
          ./oxide_int/tools/build.sh $FLAG game/base.apk game/split_config.arm64_v8a.apk
          ls -l oxide_int/build/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: oxhk-apk
          path: oxide_int/build/*.apk
          if-no-files-found: error

      - name: release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            oxide_int/build/*.apk
            oxide_int/build/liboxhk.so
