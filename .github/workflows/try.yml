on: workflow_dispatch
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_NDK_HOME=$(ls -d "$SDK"/ndk/* | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: build
        run: |
          bash -x ./oxide_int/tools/build_container.sh 2>&1 | tail -60 | tee /tmp/out.log
      - name: report
        if: always()
        run: |
          tail -40 /tmp/out.log > ci-last-failure.log || true
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -f ci-last-failure.log; git commit -m "ci: sandbox log [skip ci]" || true
          git push || true
